[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "municipal-facility-ops"
version = "0.1.0"
description = "Municipal facility inspection and maintenance platform skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic-settings==2.6.1",
  "sqlalchemy==2.0.36",
  "pymysql==1.1.1",
  "chromadb==0.5.23",
  "langchain-core==0.3.21",
  "langgraph==0.2.45",
  "openai==1.54.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
